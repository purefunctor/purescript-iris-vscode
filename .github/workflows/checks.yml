name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  attestations: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      vscode_version: ${{ steps.vscode_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve minimum VS Code version
        id: vscode_version
        run: >-
          node -e 'const fs = require("fs");
          const range = require("./package.json").engines.vscode;
          const version = range.match(/\d+\.\d+\.\d+/)?.[0];
          if (!version) throw new Error(`Cannot resolve a VS Code version from ${range}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Install dependencies
        run: npm ci

      - name: Run type checker
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests (${{ matrix.platform }}, VS Code ${{ matrix.version_label }})
    runs-on: ${{ matrix.os }}
    needs: node

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-executable: purescript-alexandrite
            test-command: xvfb-run -a npm run test:integration
          - platform: macOS
            os: macos-14
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-executable: purescript-alexandrite
            test-command: npm run test:integration
          - platform: Windows
            os: windows-2022
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-executable: purescript-alexandrite.exe
            test-command: npm run test:integration
          - platform: Linux
            os: ubuntu-24.04
            version_label: stable
            vscode_version: stable
            alexandrite-executable: purescript-alexandrite
            test-command: xvfb-run -a npm run test:integration

    env:
      ALEXANDRITE_INSTALL_DIR: ${{ runner.temp }}/alexandrite/bin
      ALEXANDRITE_PATH: ${{ runner.temp }}/alexandrite/bin/${{ matrix.alexandrite-executable }}
      GH_TOKEN: ${{ github.token }}
      VSCODE_VERSION: ${{ matrix.vscode_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Alexandrite
        if: runner.os != 'Windows'
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          https://raw.githubusercontent.com/purefunctor/purescript-alexandrite/main/install.sh
          | sh

      - name: Install Alexandrite on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          irm https://raw.githubusercontent.com/purefunctor/purescript-alexandrite/main/install.ps1
          | iex

      - name: Cache minimum VS Code
        if: matrix.version_label == 'minimum'
        uses: actions/cache@v5
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_VERSION }}

      - name: Run integration tests
        run: ${{ matrix.test-command }}

  package:
    name: Packaging check
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check extension can be packaged
        run: npm run package -- --out /tmp/alexandrite-check.vsix
