name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  attestations: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      vscode_version: ${{ steps.vscode_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve minimum VS Code version
        id: vscode_version
        run: >-
          node -e 'const fs = require("fs");
          const range = require("./package.json").engines.vscode;
          const version = range.match(/\d+\.\d+\.\d+/)?.[0];
          if (!version) throw new Error(`Cannot resolve a VS Code version from ${range}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Install dependencies
        run: npm ci

      - name: Run type checker
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests (${{ matrix.platform }}, VS Code ${{ matrix.version_label }}, Iris ${{ matrix.iris_channel }})
    runs-on: ${{ matrix.os }}
    needs: node

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            iris_channel: stable
            iris-executable: iris
            test-command: xvfb-run -a npm run test:integration
          - platform: macOS
            os: macos-14
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            iris_channel: stable
            iris-executable: iris
            test-command: npm run test:integration
          - platform: Windows
            os: windows-2022
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            iris_channel: stable
            iris-executable: iris.exe
            test-command: npm run test:integration
          - platform: Linux
            os: ubuntu-24.04
            version_label: stable
            vscode_version: stable
            iris_channel: stable
            iris-executable: iris
            test-command: xvfb-run -a npm run test:integration
          - platform: Linux
            os: ubuntu-24.04
            version_label: stable
            vscode_version: stable
            iris_channel: canary
            iris-executable: iris
            test-command: xvfb-run -a npm run test:integration

    env:
      GH_TOKEN: ${{ github.token }}
      VSCODE_VERSION: ${{ matrix.vscode_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve newest Iris canary
        if: matrix.iris_channel == 'canary'
        shell: bash
        run: |
          iris_version="$({
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              'repos/purefunctor/purescript-iris/releases?per_page=100'
          } | jq -sr '
            add
            | map(select(
                .draft == false
                and .prerelease == true
                and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9a-f]{12}$"))
              ))
            | sort_by(.published_at)
            | last
            | .tag_name // empty
          ')"

          if [[ -z "$iris_version" ]]; then
            echo 'No published non-draft Iris canary release matched v<package-semver>-dev.<12-hex-commit>.' >&2
            exit 1
          fi

          echo "Using Iris canary $iris_version"
          echo "IRIS_VERSION=$iris_version" >> "$GITHUB_ENV"

      - name: Install Iris
        if: runner.os != 'Windows'
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}/iris/bin
        run: >-
          curl --proto '=https' --tlsv1.2 -LsSf
          https://raw.githubusercontent.com/purefunctor/purescript-iris/main/install.sh
          | sh

      - name: Install Iris on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IRIS_INSTALL_DIR: ${{ runner.temp }}/iris/bin
        run: >-
          irm https://raw.githubusercontent.com/purefunctor/purescript-iris/main/install.ps1
          | iex

      - name: Verify Iris canary version
        if: matrix.iris_channel == 'canary'
        shell: bash
        run: |
          installed_version="$($RUNNER_TEMP/iris/bin/iris --version)"
          expected_version="iris ${IRIS_VERSION#v}"
          echo "Installed $installed_version"
          if [[ "$installed_version" != "$expected_version" ]]; then
            echo "Expected $expected_version, but installed $installed_version." >&2
            exit 1
          fi

      - name: Cache minimum VS Code
        if: matrix.version_label == 'minimum'
        uses: actions/cache@v5
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_VERSION }}

      - name: Run integration tests
        env:
          IRIS_PATH: ${{ runner.temp }}/iris/bin/${{ matrix.iris-executable }}
        run: ${{ matrix.test-command }}

  package:
    name: Packaging check
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check extension can be packaged
        run: npm run package -- --out /tmp/iris-check.vsix
