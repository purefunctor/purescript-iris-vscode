name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  node:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      vscode_version: ${{ steps.vscode_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve minimum VS Code version
        id: vscode_version
        run: >-
          node -e 'const fs = require("fs");
          const range = require("./package.json").engines.vscode;
          const version = range.match(/\d+\.\d+\.\d+/)?.[0];
          if (!version) throw new Error(`Cannot resolve a VS Code version from ${range}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'

      - name: Install dependencies
        run: npm ci

      - name: Run type checker
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit

  integration:
    name: Integration tests (${{ matrix.platform }}, VS Code ${{ matrix.version_label }})
    runs-on: ${{ matrix.os }}
    needs: node

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-asset: purescript-alexandrite-x86_64-unknown-linux-gnu.tar.gz
            alexandrite-executable: purescript-alexandrite
            test-command: xvfb-run -a npm run test:integration
          - platform: macOS
            os: macos-14
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-asset: purescript-alexandrite-universal-apple-darwin.tar.gz
            alexandrite-executable: purescript-alexandrite
            test-command: npm run test:integration
          - platform: Windows
            os: windows-2022
            version_label: minimum
            vscode_version: ${{ needs.node.outputs.vscode_version }}
            alexandrite-asset: purescript-alexandrite-x86_64-pc-windows-msvc.zip
            alexandrite-executable: purescript-alexandrite.exe
            test-command: npm run test:integration
          - platform: Linux
            os: ubuntu-24.04
            version_label: stable
            vscode_version: stable
            alexandrite-asset: purescript-alexandrite-x86_64-unknown-linux-gnu.tar.gz
            alexandrite-executable: purescript-alexandrite
            test-command: xvfb-run -a npm run test:integration

    env:
      VSCODE_VERSION: ${{ matrix.vscode_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve latest Alexandrite release
        id: alexandrite
        env:
          RELEASE_ASSET: ${{ matrix.alexandrite-asset }}
          RELEASE_REPOSITORY: purefunctor/purescript-alexandrite
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/resolve-latest-release-assets.mjs

      - name: Install Alexandrite
        env:
          RELEASE_ASSET: ${{ matrix.alexandrite-asset }}
          RELEASE_DIGEST: ${{ steps.alexandrite.outputs.digest }}
          RELEASE_EXECUTABLE: ${{ matrix.alexandrite-executable }}
          RELEASE_EXECUTABLE_ENVIRONMENT_VARIABLE: ALEXANDRITE_PATH
          RELEASE_REPOSITORY: purefunctor/purescript-alexandrite
          RELEASE_TAG: ${{ steps.alexandrite.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/install-release-asset.mjs

      - name: Cache minimum VS Code
        if: matrix.version_label == 'minimum'
        uses: actions/cache@v5
        with:
          path: .vscode-test/vscode-*
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_VERSION }}

      - name: Run integration tests
        run: ${{ matrix.test-command }}

  package:
    name: Packaging check
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check extension can be packaged
        run: npm run package -- --out /tmp/alexandrite-check.vsix
